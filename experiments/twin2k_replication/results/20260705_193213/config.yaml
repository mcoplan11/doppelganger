llm:
  provider: openrouter      # gemini | openai | anthropic | openrouter
  model: qwen/qwen3-30b-a3b-instruct-2507
  temperature: 0.5
  disable_reasoning: false  # true only for models that ignore /no_think (e.g. qwen3.7-max)

experiment:
  # Which experiments to run. "all" or a list of IDs.
  run: all

  # How many personas to use per condition.
  n_personas: 150

  # Random seed for reproducibility (persona assignment, subsampling).
  seed: 42

  # within  — every persona sees every condition (more power, less realistic)
  # between — personas are randomly split across conditions (mirrors original design)
  between_subject_mode: within

output:
  dir: results
