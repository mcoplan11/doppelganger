model:
  # PRIMARY (Runs 0 / A): Qwen3-30B-A3B — MoE, ~3B active params.
  # Unsloth supports it BUT 4-bit QLoRA is NOT recommended for MoE: known
  # quantization errors (github.com/unslothai/unsloth issues #2582, #3422).
  # Use bf16 LoRA instead (load_in_4bit: false) → ~60GB VRAM on A100 80GB.
  # Reduce per_device_train_batch_size to 1 if OOM; lower eval.batch_size too.
  #
  # FALLBACK (if A100 80GB can't fit bf16 30B): switch to dense Qwen3-14B
  # and re-enable 4-bit.  ~7GB VRAM; loses the MoE-rehearsal goal but method
  # questions (does grounding help?) are unaffected by model size.
  #   base: Qwen/Qwen3-14B
  #   load_in_4bit: true
  base: Qwen/Qwen3-30B-A3B
  max_seq_length: 2048
  load_in_4bit: false   # bf16 LoRA — avoid MoE quantization errors

lora:
  r: 16
  lora_alpha: 32
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  lora_dropout: 0.05

data:
  dataset_id: LLM-Digital-Twin/Twin-2K-500
  # MC = single-answer multiple choice, Matrix = Likert-style grid
  # TE (text entry) and Slider are excluded — inconsistent format
  question_types:
    - MC
    - Matrix
  # How many Twin-2K participants map to each AI persona.
  # 2 = 400 participants total — appropriate for LoRA (low parameter count).
  # Increase if you want more distributional signal; decrease for faster iteration.
  max_per_persona: 2
  # null = use all examples from the mapped participants (recommended with max_per_persona).
  max_examples: null
  val_fraction: 0.05
  seed: 42
  output_dir: data/

training:
  output_dir: checkpoints/
  num_epochs: 2
  # bf16 30B MoE needs smaller batch than 4-bit would.  Start at 1+16=16
  # effective; if OOM try gradient_accumulation_steps: 32.
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16   # effective batch = 16
  learning_rate: 2.0e-4
  warmup_steps: 100
  save_steps: 150
  logging_steps: 50

hub:
  push_to_hub: false
  repo_id: null   # e.g. "mcoplan11/qwen2.5-7b-human-survey"

eval:
  n_personas: 150
  temperature: 0.5
  between_subject_mode: within
  seed: 42
  batch_size: 8    # bf16 30B MoE: start at 8, lower to 4 if OOM
