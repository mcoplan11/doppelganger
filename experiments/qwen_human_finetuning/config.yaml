model:
  base: Qwen/Qwen2.5-7B-Instruct
  max_seq_length: 2048
  load_in_4bit: true

lora:
  r: 16
  lora_alpha: 32
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj
  lora_dropout: 0.05

data:
  dataset_id: LLM-Digital-Twin/Twin-2K-500
  # MC = single-answer multiple choice, Matrix = Likert-style grid
  # TE (text entry) and Slider are excluded — inconsistent format
  question_types:
    - MC
    - Matrix
  # How many Twin-2K participants map to each AI persona.
  # 2 = 400 participants total — appropriate for LoRA (low parameter count).
  # Increase if you want more distributional signal; decrease for faster iteration.
  max_per_persona: 2
  # null = use all examples from the mapped participants (recommended with max_per_persona).
  max_examples: null
  val_fraction: 0.05
  seed: 42
  output_dir: data/

training:
  output_dir: checkpoints/
  num_epochs: 2
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4   # effective batch = 16
  learning_rate: 2.0e-4
  warmup_steps: 100
  save_steps: 500
  logging_steps: 50

hub:
  push_to_hub: false
  repo_id: null   # e.g. "mcoplan11/qwen2.5-7b-human-survey"

eval:
  n_personas: 150
  temperature: 0.5
  between_subject_mode: within
  seed: 42
  batch_size: 32   # GPU generations per batch; lower if you hit OOM on the 48GB A6000
